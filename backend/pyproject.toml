[project]
name = "lol-commentary-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "didwjdgus90", email = "didwjdgus90@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "rank-bm25>=0.2.2",
    "selectolax>=0.4.11",
    "sentence-transformers==5.4.0",
    "transformers==4.57.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["lol_commentary_backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ty.src]
include = ["src", "tests"]

[tool.fastapi]
entrypoint = "lol_commentary_backend.main:app"
